---
- name: Verify listmonk
  hosts: all
  become: true
  gather_facts: false

  vars:
    listmonk_verify_url: "http://127.0.0.1:{{ listmonk_container_http_port }}"

    # The role's identifier is also the directory it installs into, and role
    # defaults are not in scope in a verify play.
    listmonk_verify_env_file: "/{{ listmonk_molecule_container }}/env"

    # The names carry both the role and the scenario, like the platform does, so
    # a leftover container can never be mistaken for another scenario's.
    listmonk_verify_stock_container: "{{ inventory_hostname }}-stock-control"
    listmonk_verify_control_container: "{{ inventory_hostname }}-negative-control"

    listmonk_verify_psql: >-
      docker exec {{ listmonk_molecule_postgres_container }}
      psql -U {{ listmonk_molecule_postgres_superuser }} -d {{ listmonk_database_name }} -tAc

    # The list and the subscriber the round trip creates. Distinctive enough that
    # finding them in Postgres cannot be a coincidence.
    listmonk_verify_list_name: molecule-round-trip-list
    listmonk_verify_subscriber_email: molecule-round-trip@example.com
    listmonk_verify_subscriber_name: Molecule Round Trip
    listmonk_verify_subscriber_attrib: listmonk-molecule-round-trip

    # Nobody ever creates this one. Asking for it proves the read-back below is
    # a search that discriminates, rather than a call returning whatever exists.
    listmonk_verify_absent_email: molecule-never-created@example.com

  tasks:
    # The role is not included in this playbook, so its defaults are not in
    # scope. Reading defaults/main.yml directly ties the version assertion
    # below.
    - name: Load the role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: listmonk_defaults

    - name: Read the listmonk container the role created
      ansible.builtin.command:
        cmd: "docker container inspect {{ listmonk_molecule_container }}"
      register: listmonk_container_raw
      changed_when: false

    - name: Make sense of the listmonk container
      ansible.builtin.set_fact:
        listmonk_container: "{{ (listmonk_container_raw.stdout | from_json)[0] }}"

    # ------------------------------------------------------------------
    # The negative controls: the same image, without the role's doing
    # ------------------------------------------------------------------

    # Nothing asserted below is evidence about the role unless the stock image
    # cannot produce it unaided. It cannot: with no configuration it looks for a
    # Postgres on its own localhost and gives up when there is none.
    - name: Run the listmonk image with none of the role's configuration
      ansible.builtin.command:
        cmd: >-
          timeout 120
          docker run --rm --name {{ listmonk_verify_stock_container }}
          {{ listmonk_container.Config.Image }}
      register: listmonk_stock_control
      changed_when: true
      failed_when: false

    - name: Assert the listmonk image cannot start without the role's configuration
      ansible.builtin.assert:
        # 0 would mean it ran to completion, 124 that `timeout` had to stop a
        # container which was happily running. Either would make everything
        # below unattributable to the role.
        that: listmonk_stock_control.rc not in [0, 124]
        fail_msg: >-
          The unconfigured listmonk image exited with {{ listmonk_stock_control.rc }},
          so nothing below can be credited to the role
        success_msg: >-
          The unconfigured listmonk image dies on startup (rc={{ listmonk_stock_control.rc }}),
          so a listmonk that serves anything at all is the role's doing

    # The sharper control. This run gets everything the role configures - the
    # rendered env file, the mounts the role makes, the same image - and differs
    # in exactly one respect: it is pointed at an empty database and is not given
    # the `--install` that the role's container command runs first. listmonk
    # refuses to serve a schema it has not been installed into, which is what
    # makes the bootstrap step attributable rather than assumed.
    - name: Run the listmonk image against a database the role never installed into
      ansible.builtin.command:
        cmd: >-
          timeout 120
          docker run --rm --name {{ listmonk_verify_control_container }}
          --network {{ listmonk_molecule_network }}
          --env-file {{ listmonk_verify_env_file }}
          --env LISTMONK_db__database={{ listmonk_molecule_control_database }}
          {% for mount in listmonk_container.Mounts %}--mount type=bind,src={{ mount.Source }},dst={{ mount.Destination }} {% endfor %}
          {{ listmonk_container.Config.Image }}
          sh -c "./listmonk --config ''"
      register: listmonk_install_control
      changed_when: true
      failed_when: false

    - name: Assert listmonk refuses a database it has not been installed into
      ansible.builtin.assert:
        that:
          - listmonk_install_control.rc not in [0, 124]
          - "'does not appear to be setup' in listmonk_install_control.stdout"
        fail_msg: >-
          listmonk did not refuse an un-installed database (rc={{ listmonk_install_control.rc }}):
          {{ listmonk_install_control.stdout | default('') | truncate(400) }}.
          The role's `--install` step is then not what makes the schema exist, and the
          round trip below proves less than it appears to.
        success_msg: >-
          listmonk refuses an un-installed database (rc={{ listmonk_install_control.rc }},
          "the database does not appear to be setup"), so the working instance below owes
          its schema to the role's `--install` step

    # ------------------------------------------------------------------
    # The unit is up and the service answers
    # ------------------------------------------------------------------

    - name: Wait for the listmonk systemd service to become active (up to 180s)
      ansible.builtin.systemd_service:
        name: listmonk.service
      register: listmonk_service
      until: listmonk_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert the listmonk systemd service is active
      ansible.builtin.assert:
        that: listmonk_service.status.ActiveState == 'active'
        fail_msg: "listmonk.service is not active ({{ listmonk_service.status.ActiveState }})"
        success_msg: "listmonk.service is active"

    - name: Retrieve the listmonk service log for debugging
      when: listmonk_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu listmonk.service
      changed_when: false

    # `active` only says the docker client is running. The public page is served
    # by listmonk itself, and only once it has installed its schema, upgraded it
    # and opened its listener, so this is where the service becomes truly ready.
    - name: Wait for listmonk to serve its public page (up to 8m)
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/"
        status_code: [200, 404, 502, 503]
      register: listmonk_public_page
      until: listmonk_public_page.status == 200
      retries: 96
      delay: 5

    # ------------------------------------------------------------------
    # Credentials are checked, and are the ones the role passed through
    # ------------------------------------------------------------------

    - name: Ask listmonk for a list of lists without credentials
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/api/lists"
        status_code: [403]
      register: listmonk_anonymous

    - name: Ask listmonk for a list of lists with a session that was never issued
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/api/lists"
        headers:
          Cookie: session=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
        status_code: [403]
      register: listmonk_forged_session

    # listmonk answers a rejected login with the login page (200) and a bare
    # nonce cookie, and an accepted one with a redirect and a session cookie.
    - name: Log in to listmonk with the wrong password
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/admin/login"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ listmonk_molecule_admin_username }}"
          password: "not-{{ listmonk_molecule_admin_password }}"
          nexturi: /admin
        follow_redirects: none
        status_code: [200, 302]
      register: listmonk_bad_login

    - name: Assert listmonk turns away everyone who cannot prove who they are
      ansible.builtin.assert:
        that:
          - listmonk_anonymous.status == 403
          - listmonk_forged_session.status == 403
          - listmonk_bad_login.status == 200
          - "'session=' not in (listmonk_bad_login.set_cookie | default(''))"
        fail_msg: >-
          listmonk let something through: anonymous={{ listmonk_anonymous.status }},
          forged session={{ listmonk_forged_session.status }},
          wrong password={{ listmonk_bad_login.status }}
          (cookie {{ listmonk_bad_login.set_cookie | default('none') }})
        success_msg: >-
          listmonk refuses anonymous calls and forged sessions with 403, and hands out
          no session for the wrong password

    # The administrator appears nowhere in the role's own variables. listmonk
    # creates it during `--install` out of LISTMONK_ADMIN_USER and
    # LISTMONK_ADMIN_PASSWORD, which reach the container only through
    # `listmonk_environment_variables_additional_variables`. Logging in with it
    # is what proves that free-form pass-through arrives intact.
    - name: Log in to listmonk as the administrator the role's configuration created
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/admin/login"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ listmonk_molecule_admin_username }}"
          password: "{{ listmonk_molecule_admin_password }}"
          nexturi: /admin
        follow_redirects: none
        status_code: [302]
      register: listmonk_login

    # `uri` fills in its parsed `cookies` only for 2xx responses, and an accepted
    # login is a 302, so the header itself is read instead.
    - name: Keep the listmonk session cookie
      ansible.builtin.set_fact:
        listmonk_session: "{{ listmonk_login.set_cookie | default('') | regex_search('session=[^;]+') }}"

    - name: Assert listmonk issued a session to the administrator it was told about
      ansible.builtin.assert:
        that: listmonk_session | length > 8
        fail_msg: >-
          Logging in as {{ listmonk_molecule_admin_username }} produced no session cookie
          ({{ listmonk_login.set_cookie | default('no Set-Cookie header') }}), so
          `listmonk_environment_variables_additional_variables` did not reach the container
        success_msg: >-
          listmonk issued a session to {{ listmonk_molecule_admin_username }}, the
          administrator `listmonk_environment_variables_additional_variables` named

    # ------------------------------------------------------------------
    # The running process is the version this role pins
    # ------------------------------------------------------------------

    - name: Ask listmonk about itself
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/api/config"
        headers:
          Cookie: "{{ listmonk_session }}"
        status_code: [200]
      register: listmonk_config

    # /api/config reports the version compiled into the running binary, so
    # comparing it with the leaf variable Renovate bumps ties the process that is
    # actually serving to the version the role claims to install. listmonk
    # reports it with the `v` that its image tags carry.
    - name: Assert the running listmonk is the version this role installs
      ansible.builtin.assert:
        that:
          - listmonk_config.json.data.version == ('v' ~ listmonk_defaults.listmonk_version)
          - (listmonk_container.Config.Image | split(':') | last) == ('v' ~ listmonk_defaults.listmonk_version)
        fail_msg: >-
          The running listmonk reports {{ listmonk_config.json.data.version }} out of image
          {{ listmonk_container.Config.Image }}, but `listmonk_version` pins
          {{ listmonk_defaults.listmonk_version }}
        success_msg: >-
          The running listmonk reports itself as {{ listmonk_config.json.data.version }},
          out of {{ listmonk_container.Config.Image }}, which is what `listmonk_version` pins

    - name: Ask listmonk whether it is healthy
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/api/health"
        headers:
          Cookie: "{{ listmonk_session }}"
        status_code: [200]
      register: listmonk_health

    - name: Assert listmonk reports itself healthy
      ansible.builtin.assert:
        that: listmonk_health.json.data
        fail_msg: "listmonk's health endpoint answered {{ listmonk_health.json }}"
        success_msg: "listmonk reports itself healthy"

    # ------------------------------------------------------------------
    # Configuration reaches the process, not just the files on disk
    # ------------------------------------------------------------------

    # The address is listmonk's one non-negotiable piece of configuration: the
    # role starts it with `--config ''`, so there is no config file to fall back
    # on and `LISTMONK_app__address` is the only thing that can say where to
    # listen. The scenario deliberately picks a port that is not listmonk's own
    # default of 9000, which means every answer above already depended on the
    # rendered env file having arrived. This states it outright.
    - name: Assert the listmonk container was handed the address the role configured
      ansible.builtin.assert:
        that:
          - ('LISTMONK_app__address=0.0.0.0:' ~ listmonk_container_http_port) in listmonk_container.Config.Env
          - listmonk_container_http_port != 9000
        fail_msg: >-
          The container's environment does not carry
          LISTMONK_app__address=0.0.0.0:{{ listmonk_container_http_port }}:
          {{ listmonk_container.Config.Env | select('search', '^LISTMONK_app__') | list }}
        success_msg: >-
          listmonk answers on {{ listmonk_container_http_port }} rather than its own default
          of 9000, because `listmonk_container_http_port` reached it as LISTMONK_app__address

    # ------------------------------------------------------------------
    # A round trip through the admin API, cross-checked in Postgres
    # ------------------------------------------------------------------

    - name: Create a list in listmonk
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/api/lists"
        method: POST
        headers:
          Cookie: "{{ listmonk_session }}"
        body_format: json
        body:
          name: "{{ listmonk_verify_list_name }}"
          type: private
          # listmonk's own spelling of the opt-in field, not a typo
          optin: single  # codespell:ignore
          tags:
            - molecule
        status_code: [200]
      register: listmonk_created_list

    - name: Create a subscriber on that list in listmonk
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/api/subscribers"
        method: POST
        headers:
          Cookie: "{{ listmonk_session }}"
        body_format: json
        body:
          email: "{{ listmonk_verify_subscriber_email }}"
          name: "{{ listmonk_verify_subscriber_name }}"
          status: enabled
          lists:
            - "{{ listmonk_created_list.json.data.id }}"
          preconfirm_subscriptions: true
          attribs:
            molecule: "{{ listmonk_verify_subscriber_attrib }}"
        status_code: [200]
      register: listmonk_created_subscriber

    - name: Read the subscriber back out of listmonk
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/api/subscribers?query=subscribers.email%3D%27{{ listmonk_verify_subscriber_email | urlencode }}%27"
        headers:
          Cookie: "{{ listmonk_session }}"
        status_code: [200]
      register: listmonk_read_subscriber

    # The same search for an address nobody ever created. Without it, a read-back
    # that ignored its query and returned every subscriber there is would look
    # exactly like a working one.
    - name: Search listmonk for a subscriber that was never created
      ansible.builtin.uri:
        url: "{{ listmonk_verify_url }}/api/subscribers?query=subscribers.email%3D%27{{ listmonk_verify_absent_email | urlencode }}%27"
        headers:
          Cookie: "{{ listmonk_session }}"
        status_code: [200]
      register: listmonk_read_absent

    - name: Assert listmonk stored and returned what it was given
      ansible.builtin.assert:
        that:
          - listmonk_read_subscriber.json.data.total == 1
          - listmonk_read_subscriber.json.data.results[0].email == listmonk_verify_subscriber_email
          - listmonk_read_subscriber.json.data.results[0].name == listmonk_verify_subscriber_name
          - listmonk_read_subscriber.json.data.results[0].attribs.molecule == listmonk_verify_subscriber_attrib
          - (listmonk_read_subscriber.json.data.results[0].lists | map(attribute='name') | list) == [listmonk_verify_list_name]
          - listmonk_read_absent.json.data.total == 0
        fail_msg: >-
          The round trip through listmonk's API did not come back intact:
          {{ listmonk_read_subscriber.json.data | string | truncate(400) }}
          (and {{ listmonk_read_absent.json.data.total }} results for an address never created)
        success_msg: >-
          listmonk stored {{ listmonk_verify_subscriber_email }} on
          {{ listmonk_verify_list_name }} with its attributes, returns it for a search that
          names it, and returns nothing for one that does not

    # listmonk's own API could be answering out of anything. This is the check
    # that says the data landed in the Postgres the role wired up, in the database
    # `listmonk_database_name` names, over the Unix socket the role mounts - none
    # of which listmonk would have found on its own.
    - name: Read the subscriber back out of Postgres
      ansible.builtin.command:
        cmd: >-
          {{ listmonk_verify_psql }}
          "select s.name || '|' || (s.attribs->>'molecule') || '|' || l.name
           from subscribers s
           join subscriber_lists sl on sl.subscriber_id = s.id
           join lists l on l.id = sl.list_id
           where s.email = '{{ listmonk_verify_subscriber_email }}'"
      register: listmonk_postgres_subscriber
      changed_when: false

    - name: Read listmonk's schema out of Postgres
      ansible.builtin.command:
        cmd: >-
          {{ listmonk_verify_psql }}
          "select to_regclass('public.subscribers') is not null
           and to_regclass('public.lists') is not null
           and to_regclass('public.campaigns') is not null
           and to_regclass('public.settings') is not null"
      register: listmonk_postgres_schema
      changed_when: false

    - name: Assert listmonk's data is in the Postgres database the role named
      ansible.builtin.assert:
        that:
          - (listmonk_postgres_schema.stdout | trim) == 't'
          - >-
            (listmonk_postgres_subscriber.stdout | trim) ==
            (listmonk_verify_subscriber_name ~ '|' ~ listmonk_verify_subscriber_attrib ~ '|' ~ listmonk_verify_list_name)
        fail_msg: >-
          Postgres does not hold what listmonk claims to have stored in
          {{ listmonk_database_name }}: schema present={{ listmonk_postgres_schema.stdout | trim }},
          row={{ listmonk_postgres_subscriber.stdout | trim }}
        success_msg: >-
          The {{ listmonk_database_name }} database carries listmonk's schema and the
          subscriber row itself ({{ listmonk_postgres_subscriber.stdout | trim }})

    # ------------------------------------------------------------------
    # Nothing was quietly restarting while all of that was being checked
    # ------------------------------------------------------------------

    # `Restart=always` means the unit reads `active` while it is crash-looping,
    # and a loop is exactly what a listmonk that cannot reach Postgres would
    # settle into. The window starts here, with everything already answering,
    # because restarts from before this point say nothing.
    - name: Sample the listmonk restart counter
      ansible.builtin.systemd_service:
        name: listmonk.service
      register: listmonk_restarts_before

    # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
    # tick at least once inside the window.
    - name: Watch the listmonk service for 45 seconds
      ansible.builtin.pause:
        seconds: 45

    - name: Sample the listmonk restart counter again
      ansible.builtin.systemd_service:
        name: listmonk.service
      register: listmonk_restarts_after

    - name: Assert listmonk did not restart while it was up
      ansible.builtin.assert:
        that: listmonk_restarts_after.status.NRestarts == listmonk_restarts_before.status.NRestarts
        fail_msg: >-
          listmonk restarted while it was supposedly up
          ({{ listmonk_restarts_before.status.NRestarts }} to
          {{ listmonk_restarts_after.status.NRestarts }}), so `active` was hiding a crash loop
        success_msg: >-
          listmonk did not restart over 45 seconds of watching
          (restarts so far: {{ listmonk_restarts_after.status.NRestarts }})

    - name: Show the listmonk verification summary
      ansible.builtin.debug:
        msg:
          - "listmonk systemd: {{ listmonk_service.status.ActiveState }}, restarts {{ listmonk_restarts_after.status.NRestarts }}"
          - "listmonk version: {{ listmonk_config.json.data.version }} from {{ listmonk_container.Config.Image }}"
          - "listmonk unconfigured image: exited rc={{ listmonk_stock_control.rc }}"
          - "listmonk un-installed database: exited rc={{ listmonk_install_control.rc }}, refused to serve"
          - "listmonk public page: {{ listmonk_public_page.status }} on port {{ listmonk_container_http_port }}"
          - "listmonk refusals: anonymous {{ listmonk_anonymous.status }}, forged session {{ listmonk_forged_session.status }}, wrong password {{ listmonk_bad_login.status }}"
          - "listmonk round trip: list {{ listmonk_created_list.json.data.id }}, subscriber {{ listmonk_created_subscriber.json.data.id }}, read back {{ listmonk_read_subscriber.json.data.total }} (absent search {{ listmonk_read_absent.json.data.total }})"
          - "listmonk postgres ({{ listmonk_database_name }}): {{ listmonk_postgres_subscriber.stdout | trim }}"
